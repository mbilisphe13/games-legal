<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zerotal Games — Legal</title>
<meta name="description" content="Privacy policies for Zerotal's Android games.">
<style>
  :root { --bg:#fff; --fg:#1a1d23; --muted:#5b6270; --rule:#e3e6ec; --link:#1f5fbf; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#12151b; --fg:#e6e9ef; --muted:#9aa3b2; --rule:#272c36; --link:#7aa9f0;
    }
  }
  :root[data-theme="dark"] {
    --bg:#12151b; --fg:#e6e9ef; --muted:#9aa3b2; --rule:#272c36; --link:#7aa9f0;
  }
  * { box-sizing: border-box; }
  body {
    margin:0; background:var(--bg); color:var(--fg);
    font:16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main { max-width:34rem; margin:0 auto; padding:4rem 16px; }
  h1 { font-size:1.6rem; margin:0 0 .3rem; letter-spacing:-0.02em; }
  p { color:var(--muted); margin:0 0 2rem; }
  ul { list-style:none; padding:0; margin:0; }
  li { border-top:1px solid var(--rule); }
  li:last-child { border-bottom:1px solid var(--rule); }
  a { display:block; padding:1rem .25rem; color:var(--link); text-decoration:none; font-weight:600; }
  a:hover { text-decoration:underline; }
  a span { display:block; color:var(--muted); font-weight:400; font-size:.88rem; }
</style>
</head>
<body>
<main>
  <h1>Zerotal Games</h1>
  <p>Privacy policies for our Android games.</p>
  <ul>
    <li><a href="blockwave/privacy.html">Blockwave
      <span>Block puzzle &middot; privacy policy</span></a></li>
  </ul>
</main>
</body>
</html>
